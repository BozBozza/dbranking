<!DOCTYPE html>
<html>
<head>
    <title>Character Rankings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 style="text-align:center">Dragon Ball All Power Levels</h1>

<a href="multipliers/multipliers.html" class="button-link">Multipliers</a>
<a href="info.html" class="button-link">Info</a>
<a href="guess.html" class="button-link">Guessing Game</a>
<a href="comparison.html" class="button-link">Power Level Comparison</a>

<div id="series-filter-menu"></div>

<div id="character-filter-menu"></div>

<div id="character-container"></div>


<script>
    let allCharacters = [];

    async function loadCharacters() {
        try {
            const response = await fetch('powerlevels.json');
            allCharacters = await response.json();
            createSeriesFilterMenu();
            renderDisplay(allCharacters);
        } catch (error) {
            console.error("Error loading characters:", error);
        }
    }

    const seriesColors = [
        { name: 'Dragon Ball GT', color: '#B42B2B' },
        { name: 'Dragon Ball Super', color: '#7982EA' },
        { name: 'Dragon Ball Daima', color: '#9E64E0' },
        { name: 'Dragon Ball Movies', color: '#98B17B' },
        { name: 'Dragon Ball Z', color: '#ea841b' },
        { name: 'Original Dragon Ball', color: '#C6C485' },
    ];
    // colours of the series currently toggled on
    const activeSeries = new Set();

    function createSeriesFilterMenu() {
        const menu = document.getElementById('series-filter-menu');
        // every series starts toggled on
        menu.innerHTML = seriesColors.map(series => {
            activeSeries.add(series.color.toUpperCase());
            return `
            <button class="filter-btn series-toggle active" data-color="${series.color}" style="background:${series.color}" onclick="toggleSeries('${series.color}')">${series.name}</button>
        `;
        }).join('');
    }

    function toggleSeries(color) {
        const key = color.toUpperCase();
        const btn = document.querySelector(`.series-toggle[data-color="${color}"]`);
        if (activeSeries.has(key)) {
            activeSeries.delete(key);
            btn.style.background = '';
            btn.classList.remove('active');
        } else {
            activeSeries.add(key);
            btn.style.background = color;
            btn.classList.add('active');
        }
        applySeriesFilter();
    }

    function applySeriesFilter() {
        // nothing toggled on -> show nothing
        const filtered = allCharacters.filter(char => activeSeries.has(char.border.toUpperCase()));
        renderDisplay(filtered);
    }

    function renderDisplay(dataToShow) {
        const container = document.getElementById('character-container');

        container.innerHTML = dataToShow.map(char => `
            <div class="character-card" style="border:3px solid ${char.border};">
                <span class="powerlevel">${char.powerlevel}</span>
                <img src="${char.image}" style="border:3px solid ${char.border};">
                <h2>${char.name}</h2>
                <p>${char.form}</p>
                <p>${char.info}</p>
            </div>
        `).join('');
    }

    loadCharacters();
</script>
</body>
</html>
